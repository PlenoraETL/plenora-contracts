name: spec-validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: spec-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - run: python -m pip install -r requirements-validation.txt
      - name: Published schemas retain their validation rules
        env:
          PLENORA_SCHEMA_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_schema_immutability.py
      - name: Regression tests for the conformance gates
        run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/validate_specs.py
