name: spec-validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: spec-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux e Windows: il gate di immutabilita confronta percorsi elencati da
  # Git (maiuscole/minuscole, separatori) e le euristiche dei percorsi privati
  # riconoscono forme Windows. Le due versioni di Python sono gli estremi
  # supportati; il lock e risolto per entrambi (requirements-validation.txt).
  validate:
    name: validate (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - run: python -m pip install --require-hashes -r requirements-validation.txt
      # Base of the immutability comparison, chosen by
      # tools/ci_comparison_base.py: the previous tip of main for a push to
      # main (forced or not); the tagged commit for a release tag, which must
      # be a commit of main; otherwise where the change leaves main, and the
      # gate also compares what the branch changed with the current main.
      - name: Base of the comparison
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          # The current main, not the one the checkout saw: the script and
          # the gate both fail if origin/main differs from the remote.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          base="$(python tools/ci_comparison_base.py)"
          echo "PLENORA_SCHEMA_BASE=$base" >> "$GITHUB_ENV"
      - name: Published schemas, catalogs, bindings and vectors stay immutable
        run: python tools/check_schema_immutability.py
      - run: python -m pip install -r requirements-ci-locale.txt
      - name: Regression tests for the conformance gates
        run: python tools/run_gate_tests.py --quick
      - name: Comment quality
        run: python tools/check_comments.py
      - name: Documentation quality
        run: python tools/check_docs.py
      - run: python tools/validate_specs.py
