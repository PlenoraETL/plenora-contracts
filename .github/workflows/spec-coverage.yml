name: spec-coverage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Copertura della logica dei gate (soglia in .coveragerc). Una sola
  # piattaforma: la soglia e un budget sul codice, non una prova di
  # portabilita, che resta al job `validate`.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-validation.txt
            requirements-coverage.txt
      - run: >-
          python -m pip install --require-hashes
          -r requirements-validation.txt
          -r requirements-coverage.txt
      - name: Pin the measured commit
        run: echo "PLENORA_MEASURED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements-ci-locale.txt
      - name: Measure the gates
        run: |
          python -m coverage erase
          python -m coverage run -m unittest discover -s tools -p 'test_*.py'
          python -m coverage run -a tools/check_schema_immutability.py --measured-commit "$PLENORA_MEASURED_COMMIT"
          python -m coverage run -a tools/validate_specs.py
          python -m coverage run -a tools/check_comments.py
          python -m coverage run -a tools/check_docs.py
      - name: Coverage budget
        run: python -m coverage report
